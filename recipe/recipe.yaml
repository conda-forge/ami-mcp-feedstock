schema_version: 1

context:
  version: "0.4.0"

package:
  name: ami-mcp
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/62/17/caaaa0a66a724b6b7f1b333ffd2597b2f2526520c087ff7bd8c9841d36a1/ami_mcp-${{ version }}.tar.gz
  sha256: 7c7f54ec102d2fd4d1863514e1a22b223b01f2b9d1a2851933b76497f38f4ce4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ami-mcp=ami_mcp.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.7
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pyami-atlas
    - mcp >=2.0.0,<3
    - ca-policy-lcg  # for cert
    - af-credentials >=0.4.0

tests:
  - python:
      imports:
        - ami_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - ami-mcp --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: An MCP server that exposes ATLAS Metadata Information (AMI) operations as tools for LLMs.
  homepage: https://ami-mcp.readthedocs.io/
  repository: https://github.com/kratsg/ami-mcp
  documentation: https://ami-mcp.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kratsg
