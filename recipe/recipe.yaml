schema_version: 1

context:
  version: "0.3.1"

package:
  name: ami-mcp
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/d8/d6/2f48d9fa33d4d8e802a7b90d210b1aa620f1c418ba5318ad29d17e927c7c/ami_mcp-${{ version }}.tar.gz
  sha256: dcc4df57903b7b7e3e1600a3a51a40cf277502a4cfb90bde5f800f645421fd21

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ami-mcp=ami_mcp.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.7
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pyami-atlas
    - mcp >=2.0.0,<3
    - ca-policy-lcg  # for cert
    - af-credentials >=0.2.0

tests:
  - python:
      imports:
        - ami_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - ami-mcp --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: An MCP server that exposes ATLAS Metadata Information (AMI) operations as tools for LLMs.
  homepage: https://ami-mcp.readthedocs.io/
  repository: https://github.com/kratsg/ami-mcp
  documentation: https://ami-mcp.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kratsg
